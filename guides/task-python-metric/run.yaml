models:
  - $provider: "openai/gpt-4.1-nano"

datasets:
  - $ref: "./datasets/geography_qa.yaml"

tasks:
  - $ref: "./tasks/geography_qa.yaml"

evaluation:
  key: "python-metric"
  display_name: "Python Metric"
  tags: ["Guides"]
  description: >-
    This evaluation shows how to use a Python metric.
  config_spec:
    - key: "model_key"
      type: "model"
      display_name: "Model"
      description: "Model to be used for the task."
  task_specifications:
    - key: "geography-qa"
      task_key: "geography-qa"
      model_key: "<< config.model_key >>"

config:
  model_key: "openai$gpt-4-1-nano"
