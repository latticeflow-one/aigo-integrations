display_name: "AI Knowledge MCQA Task"
key: "ai-knowledge-mcqa"
description: "Evaluates a model's accuracy on multiple-choice AI knowledge questions."
config_spec:
  - key: "dataset_key"
    type: "dataset"
    display_name: "Dataset"
    default_value: "ai-knowledge-mcqa-dataset"
    description: "Dataset containing AI knowledge multiple-choice questions."
definition:
  evaluated_entity_type: "model"
  dataset:
    key: "<< config.dataset_key >>"
  solver:
    type: "single_turn_solver"
    input_builder:
      type: "chat_completion"
      input_messages:
        - role: "system"
          content: "You are a helpful assistant. Respond with the letter of the correct answer only (A, B, C, or D)."
        - role: "user"
          content: |
            {{ sample.question }}
            A) {{ sample.A }}
            B) {{ sample.B }}
            C) {{ sample.C }}
            D) {{ sample.D }}
  scorers:
    - type: "string_equals_mcqa"
      ground_truth_choice: "{{ sample.answer }}"
      choices: '["A", "B", "C", "D"]'
