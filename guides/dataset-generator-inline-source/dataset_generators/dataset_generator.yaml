display_name: "My Science Question Generator"
key: "science-question-generator"
description: "Generates questions about pre-defined science topics."
config_spec:
  - key: "synthesizer_model_key"
    type: "model"
    display_name: "Synthesizer Model"
    description: "Model used to generate science questions."
definition:
  type: "declarative_dataset_generator"
  data_source:
    type: "inline_samples"
    samples:
      - topic: "Biology"
        style: "Multiple choice"
      - topic: "Chemistry"
        style: "Open-ended"
      - topic: "Physics"
        style: "Proofs"
  synthesizers:
    - type: "llm"
      model_key: "<< config.synthesizer_model_key >>"
      use_structured_outputs: true
      system_prompt: "You are a helpful dataset generator."
      user_prompt_template: >
        Produce 5 questions about {{ source.topic }} in the following style:
        {{ source.style }}. Also include the answer.
      sample_properties:
        question:
          type: "string"
        answer:
          type: "string"
