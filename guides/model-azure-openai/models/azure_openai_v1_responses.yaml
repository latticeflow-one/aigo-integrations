display_name: "Azure AI Foundry OpenAI v1 Responses"
key: "azure-openai-v1-responses"
description: >
  Azure AI Foundry model using the OpenAI v1 Responses endpoint.
rate_limit: 30
task: "chat_completion"
config:
  adapter:
    key: "latticeflow$openai_responses"
  connection_type: "custom_connection"
  url: $AZURE_OPENAI_V1_RESPONSES_URL
  api_key: ""
  model_key: "gpt-5.4-mini"
  custom_headers:
    authorization: "<< secrets.AZURE_OPENAI_AUTHORIZATION >>"
secrets:
  AZURE_OPENAI_AUTHORIZATION: $AZURE_OPENAI_AUTHORIZATION
