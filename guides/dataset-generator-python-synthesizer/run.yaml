datasets:
  - $ref: "./datasets/seed-dataset.yaml"
  - display_name: "QA Dataset"
    key: "dataset-python-synthesizer"
    description: >
      Dataset of general knowledge questions-answers generated using the Python
      synthesizer.
    generator_specification:
      dataset_generator_key: "dataset-generator-python-synthesizer"
      num_samples: 10
      dataset_generator_config: {}
dataset_generators:
  - display_name: "Dataset Generator with Python Synthesizer"
    key: "dataset-generator-python-synthesizer"
    description: "This is a simple dataset generator."
    config_spec: []
    definition:
      data_source:
        type: "dataset_samples"
        dataset_key: "seed-dataset"
      synthesizers:
        - type: "python"
          synthesize_snippet: !include "./dataset_generators/synthesize.py"
