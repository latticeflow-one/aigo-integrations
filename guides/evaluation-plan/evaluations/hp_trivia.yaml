datasets:
  - $ref: "../datasets/hp_trivia.yaml"
models:
  - $provider: "openai/gpt-4.1-mini"
  - $provider: "openai/gpt-4.1-nano"
tasks:
  - $ref: "../tasks/hp_trivia.yaml"
evaluation:
  key: "hp-trivia-gpt-4-1-mini-eval"
  display_name: "Harry Potter Trivia - GPT-4.1 Mini"
  config_spec:
    - key: "model_key"
      type: "model"
      display_name: "Model"
      description: "Model to be used for the task."
    - key: "judge_model_key"
      type: "model"
      display_name: "Model"
      description: "Judge model to be used for the task."
  task_specifications:
    - key: "hp-trivia-gpt-4-1-mini"
      task_key: "hp-trivia"
      display_name: "Harry Potter Trivia GPT-4.1 Mini"
      task_config:
        judge_model_key: "<< config.judge_model_key >>"
      model_key: "<< config.model_key >>"

config:
  model_key: "openai$gpt-4-1-mini"
  judge_model_key: "openai$gpt-4-1-nano"
