model_adapters:
  - display_name: "OpenAI Chat Completion Streaming"
    key: "openai-chat-completion-streaming"
    description: OpenAI chat completion streaming API model adapter.
    long_description: >
      This is an OpenAI chat completion API adapter that can be used with
      OpenAI-compatible endpoints that support streaming responses. See
      [OpenAI's documentation](https://developers.openai.com/api/reference/resources/chat/subresources/completions/methods/create)
      for model input and output structure. Streaming response is requested by sending
      `'stream'` set to `'true'` in the model request.
    task: "chat_completion"
    process_input:
      language: "jinja"
      source_code: !include "./model_adapters/openai_chat_streaming_input.jinja"
    process_output:
      language: "jinja"
      source_code: !include "./model_adapters/openai_chat_streaming_output.jinja"

models:
  - display_name: "OpenAI GPT-4.1 Nano"
    key: "openai-gpt-4-1-nano"
    description: >
      Fastest, most cost-efficient version of GPT-4.1 GPT-4.1 nano excels at instruction
      following and tool calling.
    rate_limit: 200
    task: "chat_completion"
    config:
      adapter:
        key: "openai-chat-completion-streaming"
      connection_type: "custom_connection"
      url: "https://api.openai.com/v1/chat/completions"
      api_key: $OPENAI_API_KEY
      model_key: "gpt-4.1-nano"

