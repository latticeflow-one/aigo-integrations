datasets:
  - $ref: "./datasets/qa_dataset.yaml"
models:
  - $provider: "openai/gpt-4.1-nano"
tasks:
  - $ref: "./tasks/qa_task.yaml"

evaluation:
  key: "qa_evaluation"
  display_name: "AI Knowledge MCQA Evaluation"
  config_spec:
    - key: "model_key"
      type: "model"
      display_name: "Model"
      description: "Model to be used for the task."
  task_specifications:
    - key: "ai-knowledge-mcqa-gpt-4-1-nano"
      task_key: "ai-knowledge-mcqa"
      display_name: "AI Knowledge MCQA GPT-4.1 Nano"
      model_key: "<< config.model_key >>"

config:
  model_key: "openai$gpt-4-1-nano"
