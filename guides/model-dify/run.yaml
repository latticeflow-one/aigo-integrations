model_adapters:
  - display_name: "Dify Chat Completion"
    key: "adapter-dify"
    long_description: >
      Adapter for Dify chat messages. See
      [documentation](https://docs.dify.ai/api-reference/chatflow/send-chat-message#send-chat-message).
    task: "chat_completion"
    process_input:
      language: "jinja"
      source_code: !include "./model_adapters/dify_input.jinja"
    process_output:
      language: "jinja"
      source_code: !include "./model_adapters/dify_output.jinja"

models:
  - display_name: "Dify Model"
    key: "model-dify"
    description: "Model hosted on Dify."
    rate_limit: 60
    task: "chat_completion"
    config:
      adapter:
        key: "adapter-dify"
      connection_type: "custom_connection"
      url: $DIFY_URL
      api_key: $DIFY_API_KEY
