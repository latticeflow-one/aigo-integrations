models:
  - $provider: "openai/gpt-4.1-nano"

datasets:
  - $ref: "./datasets/yes_no_qa.yaml"

tasks:
  - $ref: "./tasks/yes_no_qa.yaml"

evaluation:
  key: "string-equals-scorer"
  display_name: "String Equals Scorer"
  tags: ["Guides"]
  config_spec:
    - key: "model_key"
      type: "model"
      display_name: "Model"
      description: "Model to be used for the task."
  task_specifications:
    - key: "yes-no-qa-gpt-4-1-nano"
      task_key: "yes-no-qa"
      model_key: "<< config.model_key >>"
      task_config:
        max_words: 1
        include_context: true

config:
  model_key: "openai$gpt-4-1-nano"
