display_name: "Conversation Grading (Advanced)"
key: "judge-conversation-advanced"
description: >
  Judges a whole two-turn conversation against a graded rubric. The judge prompt
  renders the ENTIRE conversation (every turn), not just the last reply, and
  assigns one of four labels. A weighted average turns those labels into a single
  quality score, and a frequency metric shows the label distribution.
config_spec:
  - type: "model"
    key: "judge_model"
    display_name: "Judge Model"
    description: "The model used to grade the conversation."
definition:
  evaluated_entity_type: "model"
  dataset:
    key: "judge-conversations"
  solver:
    type: "multi_turn_solver"
    message_builders:
      - type: "chat_message"
        role: "system"
        content: >
          You are a helpful assistant. Keep track of the whole conversation and
          stay consistent with what you said earlier.
      - type: "chat_message"
        role: "user"
        content: "{{ sample.question_0 }}"
      - type: "generate"
      - type: "chat_message"
        role: "user"
        content: "{{ sample.question_1 }}"
      - type: "generate"
  scorers:
    - type: "labeler_via_model"
      key: "conversation_grade"
      display_name: "Conversation Grade"
      model_key: "<< config.judge_model >>"
      system_prompt: |
        You grade a multi-turn conversation between a user and an assistant.
        The second user message adds a constraint or a reframing, so a good
        assistant must carry over context from the first turn and adapt rather
        than ignore it or start from scratch.

        Use the reference description of ideal behaviour as your guide, then
        assign exactly one label:
        - 'EXCELLENT': fully handles both turns and adapts correctly to the
          second message.
        - 'ADEQUATE': mostly correct but misses minor details or adapts only
          partially.
        - 'POOR': ignores the second message, contradicts an earlier turn, or is
          factually wrong.
        - 'REFUSED': declines to answer or returns an empty / off-topic reply.
      user_prompt: |
        Reference (ideal behaviour):
        {{ sample.reference }}

        Full conversation to grade:
        {% for turn in trace.turns %}
        --- Turn {{ loop.index }} ---
        User: {{ turn.user_message.content }}
        {% for msg in turn.assistant_messages %}Assistant: {{ msg.content }}
        {% endfor %}{% endfor %}
      valid_labels: ["EXCELLENT", "ADEQUATE", "POOR", "REFUSED"]
      use_structured_outputs: true
      metrics:
        - type: "weighted_average"
          key: "conversation_quality"
          field: "label"
          name: "Conversation Quality"
          weights:
            EXCELLENT: 1.0
            ADEQUATE: 0.6
            POOR: 0.0
            REFUSED: 0.0
        - type: "frequency"
          key: "grade_distribution"
          field: "label"
