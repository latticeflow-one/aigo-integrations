display_name: "Conversation Memory"
key: "conversation_memory"
description: >
  Checks that the model can remember information from previous interactions in a
  conversation.
config_spec:
  - key: "dataset_key"
    type: "dataset"
    display_name: "Dataset"
    default_value: "conversation_memory_questions"
    description: "Dataset containing multi-turn conversation questions."
definition:
  evaluated_entity_type: "model"
  dataset:
    key: "<< config.dataset_key >>"
  solver:
    type: "multi_turn_solver"
    message_builders:
      - type: "chat_message"
        role: "system"
        content: >
          You are a helpful assistant. In every message, you have to mention the user's
          name.
      - type: "chat_message"
        role: "user"
        content: "{{ sample.question_0 }}"
      - type: "generate"
      - type: "chat_message"
        role: "user"
        content: "{{ sample.question_1 }}"
      - type: "generate"
  scorers:
    - type: "python"
      compute_scores_snippet: !include "conversation_memory_scorer.py"
      metrics:
        - type: "mean"
          key: "name_mentioned_response_0"
          field: "name_mentioned_response_0"
          name: "Name Mentioned in First Response"
        - type: "mean"
          key: "name_mentioned_response_1"
          field: "name_mentioned_response_1"
          name: "Name Mentioned in Second Response"
        - type: "mean"
          key: "correct_answer_response_0"
          field: "correct_answer_response_0"
          name: "Correct Answer in First Response"
        - type: "mean"
          key: "correct_answer_response_1"
          field: "correct_answer_response_1"
          name: "Correct Answer in Second Response"
