display_name: "RAG QA"
key: "rag-qa"
description: >
  Evaluates the groundedness of model responses on retrieval-augmented generation
  tasks using a model-as-a-judge scorer.
config_spec:
  - type: "dataset"
    key: "dataset_key"
    display_name: "Dataset"
    description: "The dataset to evaluate against."
  - type: "model"
    key: "judge_model_key"
    display_name: "Judge Model"
    description: "Model used to judge groundedness of model responses."
definition:
  evaluated_entity_type: "model"
  dataset:
    key: "<< config.dataset_key >>"
  solver:
    type: "single_turn_solver"
    input_builder:
      type: "chat_completion"
      input_messages:
        - role: "system"
          content: "You are a helpful assistant. Use only the provided context to answer."
        - role: "user"
          content: |
            Context: {{ sample.context }}
            Question: {{ sample.question }}
  scorers:
    - type: "model_as_a_judge_classifier"
      model_key: "<< config.judge_model_key >>"
      system_prompt: >
        You are an evaluator assessing the groundedness of a
        model response to a question.
        Please assess whether the response is fully grounded in the context,
        producing 'GROUNDED' if it is and 'NOT_GROUNDED' otherwise. Partially
        grounded answers or hallucinations are considered 'NOT_GROUNDED'.
      user_prompt: >
        <context>{{ sample.context }}</context>
        <response>{{ trace.get_last_assistant_text() }}</response>
      correct_labels:
        - GROUNDED
      incorrect_labels:
        - NOT_GROUNDED
      use_structured_outputs: true
      metrics:
        - type: "mean"
          field: "pass^3"
          name: "Model Reliability (pass^3.mean)"
  trials:
    num_trials: 5
    score_aggregators:
      - score_name: is_correct
        aggregator:
          function: "pass^k"
          k: 3
          score_name: "pass^3"
