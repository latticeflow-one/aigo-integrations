key: "city-distance-prompt-generator"
display_name: "City Distance Prompt Generator"
description: "Generates navigation prompts from all combinations of cities and distances."
config_spec:
  - key: "cities_dataset_key"
    type: "dataset"
    display_name: "Cities Dataset"
    default_value: "cities_dataset"
    description: "Dataset containing the cities to generate navigation prompts from."
  - key: "distances_dataset_key"
    type: "dataset"
    display_name: "Distances Dataset"
    default_value: "distances_dataset"
    description: "Dataset containing the distances to use in navigation prompts."
definition:
  type: "declarative_dataset_generator"
  data_source:
    type: "dataset_sample_combinations"
    dataset_keys:
      - "<< config.cities_dataset_key >>"
      - "<< config.distances_dataset_key >>"
  synthesizers:
    - type: "template"
      template: |
        I'm in {{ source.city }}, the capital of {{ source.country }}.

        I want to travel {{ source.distance }} in the {direction} direction.

        What is the name of the city I will arrive at?
      fields:
        direction:
          - "north"
          - "south"
          - "east"
          - "west"
