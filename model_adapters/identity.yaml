display_name: "Identity"
key: "identity-adapter"
description: >
  This is an identity adapter, i.e. adapter that does no transformation of the model 
  input or output.
modality: "text"
task: "chat_completion"
process_input:
  language: "jinja"
  source_code: |
    {{ input | tojson }}
process_output:
  language: "jinja"
  source_code: |
    {% set body = body | fromjson %}
    {{ body | tojson }}
