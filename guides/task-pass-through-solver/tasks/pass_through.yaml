display_name: "Pass-through QA Evaluation"
key: "pass-through-qa"
description: >
  Example task that uses the pass-through solver to evaluate pre-recorded
  conversations without invoking any model.
config_spec:
  - key: "dataset_key"
    type: "dataset"
    display_name: "Dataset"
    default_value: "recorded-qa-traces"
definition:
  dataset:
    key: "<< config.dataset_key >>"
  solver:
    type: "pass_through_solver"
    message_format: "open_responses"
    trace_column: "trace"
  scorers:
    - type: "string_equals"
      ground_truth: "{{ sample.target }}"
