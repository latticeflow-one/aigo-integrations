display_name: "Multiple Choice QA Evaluation"
key: "mcqa"
description: >
  Evaluates model accuracy on multiple choice questions using MCQA string equality
  scoring with a configurable answer column.
evaluated_entity_type: "model"
config_spec:
  - type: "dataset_column"
    key: "answer_column"
    display_name: "Answer Column"
    description: "Dataset column containing the correct single-character answer choice."
definition:
  dataset:
    key: "mcqa"
  solver:
    type: "single_turn_solver"
    input_builder:
      type: "chat_completion"
      input_messages:
        - role: "system"
          content: "Answer with a single letter corresponding to the correct option."
        - role: "user"
          content: "{{ sample.prompt }}"
  scorers:
    - type: "string_equals_mcqa"
      ground_truth_choice: "{{ sample.<< config.answer_column >> }}"
      choices: "{{ sample.choices }}"
      metrics:
        - type: "mean"
          field: "is_correct"
          name: "MCQA Accuracy"
