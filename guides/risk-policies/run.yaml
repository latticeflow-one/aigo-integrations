datasets:
  - $ref: "./datasets/ai-knowledge-mcqa.yaml"

models:
  - $provider: "openai/gpt-4.1-nano"

tasks:
  - $ref: "./tasks/ai-knowledge-mcqa.yaml"

evaluation:
  key: "ai-knowledge-mcqa"
  display_name: "AI Knowledge MCQA"
  description: >-
    This evaluation checks a model's accuracy on multiple-choice AI knowledge questions.
  config_spec:
    - key: "model_key"
      type: "model"
      display_name: "Model"
      description: "Model to be used for the task."
  task_specifications:
    - key: "ai-knowledge-mcqa"
      task_key: "ai-knowledge-mcqa"
      display_name: "AI Knowledge MCQA"
      model_key: "<< config.model_key >>"

config:
  model_key: "openai$gpt-4-1-nano"
