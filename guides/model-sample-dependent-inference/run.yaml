datasets:
  - $ref: "./datasets/dataset.yaml"

models:
  - $ref: "./models/model.yaml"

tasks:
  - $ref: "./tasks/task.yaml"

evaluation:
  key: "sample-dependent-inference"
  display_name: "Sample Dependent Inference"
  description: >-
    This evaluation shows how to use sample-dependent inference.
  config_spec:
    - key: "model_key"
      type: "model"
      display_name: "Model"
      description: "Model to be used for the task."
  task_specifications:
    - key: "example-task-with-sample-dependent-inference"
      task_key: "example-task-with-sample-dependent-inference"
      model_key: "<< config.model_key >>"

config:
  model_key: "custom-sample-dependent-inference"
