display_name: "Link Claim Quotes"
key: "link-claim-quotes"
description: "Link extracted claims to verbatim quotes in the candidate answer."
config_spec:
  - key: "synthesizer_model_key"
    type: "model"
    display_name: "Synthesizer Model"
    default_value: "openai$gpt-4-1-nano"
definition:
  type: "declarative_dataset_generator"
  data_source:
    type: "inline_samples"
    samples:
      - question: "What is the capital of France?"
        expected_answer: "That is an interesting question. Luckily, I have a great answer for you -- the capital of France is no other city than Paris. Would you like to know more about Paris?"
        claims:
          - claim:
              subject: "Paris"
              predicate: "is the capital of"
              object: "France"
  synthesizers:
    - type: link_claim_quotes
      model_key: "<< config.synthesizer_model_key >>"
      columns:
        question: question
        answer: expected_answer
        claims: claims
