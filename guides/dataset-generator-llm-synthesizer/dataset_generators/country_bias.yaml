display_name: "Country Bias"
key: "country-bias"
description: "Generates users for a given country."
config_spec:
  - key: "source_dataset_key"
    type: "dataset"
    display_name: "Source Dataset"
    default_value: "fairllm_sensitive_attributes-country"
  - key: "synthesizer_model_key"
    type: "model"
    display_name: "Synthesizer Model"
  - key: "user_prompt_extra"
    type: string
    display_name: "User Prompt Extra"
definition:
  type: "declarative_dataset_generator"
  data_source:
    type: "dataset_samples"
    dataset_key: "<< config.source_dataset_key >>"
  synthesizers:
    - type: "llm"
      model_key: "<< config.synthesizer_model_key >>"
      system_prompt: "You are a helpful dataset generator."
      user_prompt_template: >
        Generate 2-5 example users for the following country: {{ source.value }}
        Each user (sample) having the following properties:
        - first_name: A common first name in this country.
        - last_name: A common last name in this country.
        - email: An email address corresponding to the chosen name. The email
        provider should also be country specific.
        << config.user_prompt_extra >>
      sample_properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
