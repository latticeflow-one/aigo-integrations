key: "city-language-qa-generator"
display_name: "City Language QA Generator"
description: "Generates QA samples from all combinations of cities and languages."
config_spec: []
definition:
  type: "declarative_dataset_generator"
  data_source:
    type: "dataset_sample_combinations"
    dataset_keys:
      - "cities-dataset"
      - "languages-dataset"
  synthesizers:
    - type: "llm"
      model_key: "openai$gpt-4-1-nano"
      system_prompt_template: "You are a helpful dataset generator."
      user_prompt_template: >
        Generate a question-answer pair about {{ source.cities-dataset.city }},
        the capital of {{ source.cities-dataset.country }}, written in
        {{ source.languages-dataset.language }}.
      sample_properties:
        question:
          type: string
        answer:
          type: string
