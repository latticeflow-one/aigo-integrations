models:
  - $provider: "openai/gpt-4.1-nano"

datasets:
  - $ref: "./datasets/recorded_qa_traces.yaml"

tasks:
  - $ref: "./tasks/pass_through.yaml"

evaluation:
  key: "pass-through-solver"
  display_name: "Pass-through Solver"
  tags: ["Guides"]
  description: >-
    This evaluation shows how to use a pass-through solver.
  config_spec:
    - key: "model_key"
      type: "model"
      display_name: "Model"
      description: "Model to be used for the task."
  task_specifications:
    - key: "pass-through-qa"
      task_key: "pass-through-qa"
      display_name: "Pass-through QA"
      model_key: "<< config.model_key >>"

config:
  model_key: "openai$gpt-4-1-nano"
  judge_model_key: "openai$gpt-4-1-nano"
