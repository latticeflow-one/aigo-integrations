key: "city-language-qa-generator"
display_name: "City Language QA Generator"
description: "Generates QA samples from all combinations of cities and languages."
config_spec:
  - key: "cities_dataset_key"
    type: "dataset"
    display_name: "Cities Dataset"
    default_value: "cities_dataset"
    description: "Dataset containing the cities to generate QA samples from."
  - key: "languages_dataset_key"
    type: "dataset"
    display_name: "Languages Dataset"
    default_value: "languages_dataset"
    description: "Dataset containing the languages to generate QA samples in."
  - key: "synthesizer_model_key"
    type: "model"
    display_name: "Synthesizer Model"
    description: "Model used to generate QA samples."
definition:
  type: "declarative_dataset_generator"
  data_source:
    type: "dataset_sample_combinations"
    dataset_keys:
      - "<< config.cities_dataset_key >>"
      - "<< config.languages_dataset_key >>"
  synthesizers:
    - type: "llm"
      model_key: "<< config.synthesizer_model_key >>"
      use_structured_outputs: true
      system_prompt: "You are a helpful dataset generator."
      user_prompt_template: >
        Generate a question-answer pair about {{ source.city }},
        the capital of {{ source.country }}, written in
        {{ source.language }}.
      sample_properties:
        question:
          type: string
        answer:
          type: string
