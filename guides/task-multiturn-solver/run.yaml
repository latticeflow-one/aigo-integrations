models:
  - $provider: "openai/gpt-4.1-nano"

datasets:
  - $ref: "./datasets/qa_single_answers.yaml"

tasks:
  - $ref: "./tasks/multiturn_clarification.yaml"

evaluation:
  key: "multiturn-solver"
  display_name: "Multiturn Solver"
  description: >-
    This evaluation shows how to use a multi-turn solver.
  config_spec:
    - key: "model_key"
      type: "model"
      display_name: "Model"
      description: "Model to be used for the task."
    - key: "judge_model_key"
      type: "model"
      display_name: "Judge Model"
      description: "Judge model to be used for the task."
  task_specifications:
    - key: "multiturn-clarification"
      task_key: "multiturn-clarification"
      task_config:
        judge_model_key: "<< config.judge_model_key >>"
      model_key: "<< config.model_key >>"

config:
  model_key: "openai$gpt-4-1-nano"
  judge_model_key: "openai$gpt-4-1-nano"
