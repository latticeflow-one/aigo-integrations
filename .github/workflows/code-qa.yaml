# This workflow runs the AI GO! Integrations Code QA (pre-commit checks).
name: code-qa
on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  code_qa:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install pre-commit into uv-managed venv
        run: uv pip install --python "$VIRTUAL_ENV/bin/python" pre-commit
      - name: Cache pre-commit hook environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit on all files
        run: "$VIRTUAL_ENV/bin/pre-commit run --all-files --show-diff-on-failure"
