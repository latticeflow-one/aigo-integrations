key: "language-labeling"
display_name: "Language Labeling"
description: >
  Answers multilingual questions, labels the response language, and scores answer
  quality. Action rules exclude non-English responses, specific sample IDs, and
  dataset-flagged holdout samples from the quality metric.
config_spec:
  - type: "model"
    key: "judge_model"
    display_name: "Judge Model"
    description: "The model used to label the language of model responses."
definition:
  evaluated_entity_type: "model"
  dataset:
    key: "multilingual-questions"
  solver:
    type: "single_turn_solver"
    input_builder:
      type: "chat_completion"
      input_messages:
        - role: "system"
          content: "Respond in the same language as the question. Answer concisely."
        - role: "user"
          content: "{{ sample.question }}"
  scorers:
    - type: "labeler_via_model"
      key: "language_labeller"
      purpose: "qa"
      model_key: "<< config.judge_model >>"
      system_prompt: >
        You are a language detection assistant.
        Respond with exactly one of these labels:
        - 'ENGLISH': if the text is entirely in English
        - 'OTHER': if the text is in any other language or mixed languages
      user_prompt: >
        <TEXT>{{ trace.get_last_assistant_text() }}</TEXT>
        Label:
      valid_labels:
        - "ENGLISH"
        - "OTHER"
    - type: "model_as_a_judge_scorer"
      key: "answer_quality"
      model_key: "<< config.judge_model >>"
      system_prompt: >
        You are an expert evaluator. Rate the quality of the answer to the given
        question on a scale from 0 to 100, where 100 means the answer is fully
        correct and complete, and 0 means it is entirely wrong or unhelpful.
        Return only the numeric score.
      user_prompt: >
        <question>{{ sample.question }}</question>
        <answer>{{ trace.get_last_assistant_text() }}</answer>
      score_min: 0
      score_max: 100
      metrics:
        - type: "mean"
          field: "score"
          name: "Mean Answer Quality"
  actions:
    - $ref: "../action_rules/exclude_non_english.yaml"
    - $ref: "../action_rules/exclude_sample_ids.yaml"
    - $ref: "../action_rules/exclude_holdout.yaml"
