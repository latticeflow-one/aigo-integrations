models:
  - $provider: "openai/gpt-4.1-nano"

datasets:
  - $ref: "./datasets/rag_qa.yaml"
  - $ref: "./datasets/qa.yaml"
  - $ref: "./datasets/conversations.yaml"

tasks:
  - $ref: "./tasks/rag_qa.yaml"
  - $ref: "./tasks/qa_basic.yaml"
  - $ref: "./tasks/conversation_advanced.yaml"

evaluation:
  key: "model-as-a-judge-scorer"
  display_name: "Model As A Judge Scorer"
  tags: ["Guides"]
  config_spec:
    - key: "model_key"
      type: "model"
      display_name: "Model"
      description: "Model to be used for the task."
    - key: "judge_model_key"
      type: "model"
      display_name: "Model"
      description: "Judge model to be used for the task."
    - key: "dataset_key"
      type: "dataset"
      display_name: "Dataset"
      description: "Dataset to be used for the task."
  task_specifications:
    - key: "rag-qa-groundedness-gpt-4-1-nano"
      task_key: "rag-qa"
      model_key: "<< config.model_key >>"
      task_config:
        dataset_key: "<< config.dataset_key >>"
        judge_model_key: "<< config.judge_model_key >>"
        evaluation_dimension: "groundedness"
    - key: "rag-qa-relevance-gpt-4-1-nano"
      task_key: "rag-qa"
      model_key: "<< config.model_key >>"
      task_config:
        dataset_key: "<< config.dataset_key >>"
        judge_model_key: "<< config.judge_model_key >>"
        evaluation_dimension: "relevance"
    - key: "judge-qa-basic-gpt-4-1-nano"
      task_key: "judge-qa-basic"
      model_key: "<< config.model_key >>"
      task_config:
        judge_model_key: "<< config.judge_model_key >>"
    - key: "judge-conversation-advanced-gpt-4-1-nano"
      task_key: "judge-conversation-advanced"
      model_key: "<< config.model_key >>"
      task_config:
        judge_model_key: "<< config.judge_model_key >>"

config:
  model_key: "openai$gpt-4-1-nano"
  judge_model_key: "openai$gpt-4-1-nano"
  dataset_key: "rag-qa"
