display_name: "OpenAI GPT-4.1 Mini 2025-04-14"
key: "gpt-4-1-mini-2025-04-14"
description: > 
  GPT-4.1 mini is a smaller, faster version of GPT-4.1. It excels at instruction 
  following and tool calling. It features a 1M token context window, and low latency
  without a reasoning step.
rate_limit: 200
task: "chat_completion"
config:
  adapter:
    key: "latticeflow$openai_chat_completion"
  connection_type: "custom_connection"
  url: "https://api.openai.com/v1/chat/completions"
  api_key: $OPENAI_API_KEY
  model_key: "gpt-4.1-mini-2025-04-14"
