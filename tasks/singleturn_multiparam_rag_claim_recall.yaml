key: "rag_claim_recall"
display_name: "RAG Claim Recall"
description: "Measures the fraction of ground-truth answer claims that are found in the retrieved chunks."
evaluated_entity_type: "model"
config_spec:
  - type: "dataset"
    key: "qa_single_answers"
    display_name: "QA Dataset"
  - type: "model"
    key: "judge_model"
    display_name: "Judge Model"
  - type: "string"
    key: "query_column"
    display_name: "Query Column"
  - type: "string"
    key: "target_column"
    display_name: "Target Column"
definition:
  dataset:
    key: "<< config.qa_single_answers >>"
  solver:
    type: "single_turn_solver"
    input_builder:
      type: "chat_completion"
      input_messages:
        - role: "user"
          content: "{{ sample.<< config.query_column >> }}"
  scorers:
    - type: "rag_checker"
      query_column: "<< config.query_column >>"
      target_column: "<< config.target_column >>"
      judge_model_key: "<< config.judge_model >>"
      scores_to_compute:
        - "claim_recall"
