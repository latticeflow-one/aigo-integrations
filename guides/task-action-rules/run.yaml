datasets:
  - $ref: "./datasets/questions.yaml"

models:
  - $provider: "openai/gpt-4.1-nano"

tasks:
  - $ref: "./tasks/language_labeling.yaml"

evaluation:
  key: "language-labeling"
  display_name: "Language Labeling"
  description: >-
    This evaluation checks that the model can correctly label the language of the questions
    and then answer questions in the language they are asked in.
  config_spec:
    - key: "model_key"
      type: "model"
      display_name: "Model"
      description: "Model to be used for the task."
    - key: "judge_model_key"
      type: "model"
      display_name: "Judge Model"
      description: "Judge model to be used for the task."
  task_specifications:
    - key: "language-labeling"
      task_key: "language-labeling"
      display_name: "Language Labeling"
      task_config:
        judge_model_key: "<< config.judge_model_key >>"
      model_key: "<< config.model_key >>"

config:
  model_key: "openai$gpt-4-1-nano"
  judge_model_key: "openai$gpt-4-1-nano"
