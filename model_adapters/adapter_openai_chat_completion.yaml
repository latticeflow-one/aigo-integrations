display_name: "OpenAI Chat Completion"
key: "openai-chat-completion"
description: OpenAI chat completion API model adapter.
long_description: >
  This is an OpenAI chat completion API adapter that can be used with OpenAI-compatible
  endpoints. See
  [OpenAI's documentation](https://platform.openai.com/docs/api-reference/chat/create)
  for model input and output structure. 
task: "chat_completion"
process_input:
  language: "jinja"
  source_code: !include ./helpers/openai_chat_completion_input.jinja
process_output:
  language: "jinja"
  source_code: !include ./helpers/openai_chat_completion_output.jinja
