display_name: "Identity Chat Completion"
key: "identity-adapter"
description: >
  This is an identity adapter, i.e. adapter that does no transformation of the model
  input or output.
process_input:
  language: "jinja"
  source_code: |
    {{ input | tojson }}
process_output:
  language: "jinja"
  source_code: |
    {% if status_code != 200 %}
        {"error": "A non-200 status code ({{ status_code }}) was returned by the model."}
    {% else %}
    {{ body }}
    {% endif %}
